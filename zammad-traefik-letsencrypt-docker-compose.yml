# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:3.7@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf}
  postgres: &postgres-image ${ZAMMAD_POSTGRES_IMAGE_TAG:-postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73}
  elasticsearch: &elasticsearch-image ${ZAMMAD_ELASTICSEARCH_IMAGE_TAG:-elasticsearch:8.19.20@sha256:7c6a3d514563848873ae3e0e2e36502382842ebae38134a59e91214e8fcdabf3}
  memcached: &memcached-image ${ZAMMAD_MEMCACHE_IMAGE_TAG:-memcached:1.6-alpine@sha256:c29847751abb41f4c268c84fb3087fee05d4edcbda44409ccb5086e26148e8a7}
  redis: &redis-image ${ZAMMAD_REDIS_IMAGE_TAG:-redis:7.4@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7}
  zammad: &zammad-image ${ZAMMAD_IMAGE_TAG:-ghcr.io/zammad/zammad:7.1.3@sha256:1f221ee8df5e84392542a5e3673312548429e87cda055f0fa34eeaca4ff7b94d}

networks:
  zammad-network:
    external: true
  traefik-network:
    external: true

volumes:
  zammad-postgres:
  redis-data:
  zammad-backup:
  zammad-storage:
  elasticsearch-data:
  traefik-certificates:

services:
  postgres:
    image: *postgres-image
    # Resource limits as .env-overridable defaults (e.g. ZAMMAD_POSTGRES_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZAMMAD_POSTGRES_MEMORY_LIMIT:-1g}
          cpus: "${ZAMMAD_POSTGRES_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${ZAMMAD_POSTGRES_MEMORY_RESERVATION:-128m}
          cpus: "${ZAMMAD_POSTGRES_CPU_RESERVATION:-0.25}"
    command: postgres -c 'max_connections=50'
    volumes:
      - zammad-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${ZAMMAD_DB_NAME:-zammaddb}
      POSTGRES_USER: ${ZAMMAD_DB_USER:-zammaddbuser}
      POSTGRES_PASSWORD: ${ZAMMAD_DB_PASSWORD:?set in .env - see .env.example for generation command}
    networks:
      - zammad-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${ZAMMAD_DB_NAME:-zammaddb}", "-U", "${ZAMMAD_DB_USER:-zammaddbuser}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  redis:
    image: *redis-image
    # Resource limits as .env-overridable defaults (e.g. ZAMMAD_REDIS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZAMMAD_REDIS_MEMORY_LIMIT:-256m}
          cpus: "${ZAMMAD_REDIS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${ZAMMAD_REDIS_MEMORY_RESERVATION:-32m}
          cpus: "${ZAMMAD_REDIS_CPU_RESERVATION:-0.1}"
    volumes:
      - redis-data:/data
    networks:
      - zammad-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  elasticsearch:
    image: *elasticsearch-image
    # Resource limits as .env-overridable defaults (e.g. ZAMMAD_ELASTICSEARCH_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZAMMAD_ELASTICSEARCH_MEMORY_LIMIT:-2g}
          cpus: "${ZAMMAD_ELASTICSEARCH_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${ZAMMAD_ELASTICSEARCH_MEMORY_RESERVATION:-256m}
          cpus: "${ZAMMAD_ELASTICSEARCH_CPU_RESERVATION:-0.5}"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - zammad-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  memcached:
    command: memcached -m 256M
    image: *memcached-image
    # Resource limits as .env-overridable defaults (e.g. ZAMMAD_MEMCACHED_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZAMMAD_MEMCACHED_MEMORY_LIMIT:-256m}
          cpus: "${ZAMMAD_MEMCACHED_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${ZAMMAD_MEMCACHED_MEMORY_RESERVATION:-32m}
          cpus: "${ZAMMAD_MEMCACHED_CPU_RESERVATION:-0.1}"
    networks:
      - zammad-network
    restart: unless-stopped

  init:
    image: *zammad-image
    # Resource limits as .env-overridable defaults (e.g. ZAMMAD_INIT_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZAMMAD_INIT_MEMORY_LIMIT:-1g}
          cpus: "${ZAMMAD_INIT_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${ZAMMAD_INIT_MEMORY_RESERVATION:-128m}
          cpus: "${ZAMMAD_INIT_CPU_RESERVATION:-0.25}"
    command: ["zammad-init"]
    user: 0:0
    volumes:
      - zammad-storage:/opt/zammad/storage
    environment:
      POSTGRESQL_DB: ${ZAMMAD_DB_NAME:-zammaddb}
      POSTGRESQL_HOST: ${ZAMMAD_POSTGRES_HOST:-postgres}
      POSTGRESQL_USER: ${ZAMMAD_DB_USER:-zammaddbuser}
      POSTGRESQL_PASS: ${ZAMMAD_DB_PASSWORD}
      POSTGRESQL_PORT: ${ZAMMAD_DB_PORT:-5432}
      POSTGRESQL_OPTIONS: ?pool=50
      MEMCACHE_SERVERS: ${ZAMMAD_MEMCACHE_SERVERS:-memcached:11211}
      REDIS_URL: ${ZAMMAD_REDIS_URL:-redis://redis:6379}
    networks:
      - zammad-network
    restart: on-failure
    depends_on:
      - postgres

  zammad:
    image: *zammad-image
    # Resource limits as .env-overridable defaults (e.g. ZAMMAD_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZAMMAD_MEMORY_LIMIT:-2g}
          cpus: "${ZAMMAD_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${ZAMMAD_MEMORY_RESERVATION:-256m}
          cpus: "${ZAMMAD_CPU_RESERVATION:-0.5}"
    command: ["zammad-nginx"]
    environment:
      NGINX_PORT: 8080
      ZAMMAD_RAILSSERVER_HOST: railsserver
      ZAMMAD_RAILSSERVER_PORT: 3000
      ZAMMAD_WEBSOCKET_HOST: websocket
      ZAMMAD_WEBSOCKET_PORT: 6042
      RAILS_TRUSTED_PROXIES: '127.0.0.1, ::1, traefik'
      NGINX_SERVER_SCHEME: https
      POSTGRESQL_DB: ${ZAMMAD_DB_NAME:-zammaddb}
      POSTGRESQL_HOST: ${ZAMMAD_POSTGRES_HOST:-postgres}
      POSTGRESQL_USER: ${ZAMMAD_DB_USER:-zammaddbuser}
      POSTGRESQL_PASS: ${ZAMMAD_DB_PASSWORD}
      POSTGRESQL_PORT: ${ZAMMAD_DB_PORT:-5432}
      MEMCACHE_SERVERS: ${ZAMMAD_MEMCACHE_SERVERS:-memcached:11211}
      REDIS_URL: ${ZAMMAD_REDIS_URL:-redis://redis:6379}
      ELASTICSEARCH_ENABLED: ${ZAMMAD_ELASTICSEARCH_ENABLED:-true}
      ELASTICSEARCH_HOST: ${ZAMMAD_ELASTICSEARCH_HOST:-elasticsearch}
      ELASTICSEARCH_PORT: ${ZAMMAD_ELASTICSEARCH_PORT:-9200}
      ELASTICSEARCH_SSL_VERIFY: ${ZAMMAD_ELASTICSEARCH_SSL_VERIFY:-true}
    networks:
      - zammad-network
      - traefik-network
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.zammad.rule=Host(`${ZAMMAD_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.zammad.service=zammad"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.zammad.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.zammad.loadbalancer.server.port=8080"
      # Enable TLS on this router
      - "traefik.http.routers.zammad.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.zammad.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.zammad.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.zammad.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Define allowed methods for CORS on Zammad routes
      - "traefik.http.middlewares.zammad-cors.headers.accessControlAllowMethods=GET,OPTIONS,PUT"
      # Allow all origins for CORS on Zammad routes
      - "traefik.http.middlewares.zammad-cors.headers.accessControlAllowOriginList=*"
      # Allow all headers for CORS on Zammad routes
      - "traefik.http.middlewares.zammad-cors.headers.accessControlAllowHeaders=*"
      # Add 'Vary' header to responses for proper caching with CORS
      - "traefik.http.middlewares.zammad-cors.headers.addVaryHeader=true"
      # Attach the CORS middleware to the Zammad router
      - "traefik.http.routers.zammad.middlewares=zammad-cors"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      - railsserver

  railsserver:
    image: *zammad-image
    # Resource limits as .env-overridable defaults (e.g. ZAMMAD_RAILSSERVER_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZAMMAD_RAILSSERVER_MEMORY_LIMIT:-1g}
          cpus: "${ZAMMAD_RAILSSERVER_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${ZAMMAD_RAILSSERVER_MEMORY_RESERVATION:-128m}
          cpus: "${ZAMMAD_RAILSSERVER_CPU_RESERVATION:-0.25}"
    command: ["zammad-railsserver"]
    environment:
      POSTGRESQL_DB: ${ZAMMAD_DB_NAME:-zammaddb}
      POSTGRESQL_HOST: ${ZAMMAD_POSTGRES_HOST:-postgres}
      POSTGRESQL_USER: ${ZAMMAD_DB_USER:-zammaddbuser}
      POSTGRESQL_PASS: ${ZAMMAD_DB_PASSWORD}
      POSTGRESQL_PORT: ${ZAMMAD_DB_PORT:-5432}
      POSTGRESQL_OPTIONS: ?pool=50
      MEMCACHE_SERVERS: ${ZAMMAD_MEMCACHE_SERVERS:-memcached:11211}
      REDIS_URL: ${ZAMMAD_REDIS_URL:-redis://redis:6379}
    networks:
      - zammad-network
    restart: unless-stopped
    depends_on:
      - memcached
      - postgres
      - redis

  scheduler:
    image: *zammad-image
    # Resource limits as .env-overridable defaults (e.g. ZAMMAD_SCHEDULER_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZAMMAD_SCHEDULER_MEMORY_LIMIT:-1g}
          cpus: "${ZAMMAD_SCHEDULER_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${ZAMMAD_SCHEDULER_MEMORY_RESERVATION:-128m}
          cpus: "${ZAMMAD_SCHEDULER_CPU_RESERVATION:-0.25}"
    command: ["zammad-scheduler"]
    environment:
      POSTGRESQL_DB: ${ZAMMAD_DB_NAME:-zammaddb}
      POSTGRESQL_HOST: ${ZAMMAD_POSTGRES_HOST:-postgres}
      POSTGRESQL_USER: ${ZAMMAD_DB_USER:-zammaddbuser}
      POSTGRESQL_PASS: ${ZAMMAD_DB_PASSWORD}
      POSTGRESQL_PORT: ${ZAMMAD_DB_PORT:-5432}
      POSTGRESQL_OPTIONS: ?pool=50
      MEMCACHE_SERVERS: ${ZAMMAD_MEMCACHE_SERVERS:-memcached:11211}
      REDIS_URL: ${ZAMMAD_REDIS_URL:-redis://redis:6379}
    networks:
      - zammad-network
    restart: unless-stopped
    depends_on:
      - memcached
      - railsserver
      - redis

  websocket:
    image: *zammad-image
    # Resource limits as .env-overridable defaults (e.g. ZAMMAD_WEBSOCKET_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZAMMAD_WEBSOCKET_MEMORY_LIMIT:-1g}
          cpus: "${ZAMMAD_WEBSOCKET_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${ZAMMAD_WEBSOCKET_MEMORY_RESERVATION:-128m}
          cpus: "${ZAMMAD_WEBSOCKET_CPU_RESERVATION:-0.25}"
    command: ["zammad-websocket"]
    environment:
      POSTGRESQL_DB: ${ZAMMAD_DB_NAME:-zammaddb}
      POSTGRESQL_HOST: ${ZAMMAD_POSTGRES_HOST:-postgres}
      POSTGRESQL_USER: ${ZAMMAD_DB_USER:-zammaddbuser}
      POSTGRESQL_PASS: ${ZAMMAD_DB_PASSWORD}
      POSTGRESQL_PORT: ${ZAMMAD_DB_PORT:-5432}
      POSTGRESQL_OPTIONS: ?pool=50
      MEMCACHE_SERVERS: ${ZAMMAD_MEMCACHE_SERVERS:-memcached:11211}
      REDIS_URL: ${ZAMMAD_REDIS_URL:-redis://redis:6379}
    networks:
      - zammad-network
      - traefik-network
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.zammad-websocket.rule=Host(`${ZAMMAD_WEBSOCKET_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.zammad-websocket.service=zammad-websocket"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.zammad-websocket.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.zammad-websocket.loadbalancer.server.port=6042"
      # Enable TLS on this router
      - "traefik.http.routers.zammad-websocket.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.zammad-websocket.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.zammad-websocket.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.zammad-websocket.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      - memcached
      - railsserver
      - redis

  traefik:
    image: *traefik-image
    # Resource limits as .env-overridable defaults (e.g. TRAEFIK_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-256m}
          cpus: "${TRAEFIK_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${TRAEFIK_MEMORY_RESERVATION:-64m}
          cpus: "${TRAEFIK_CPU_RESERVATION:-0.1}"
    command:
      # Set the log level (DEBUG, INFO, WARN, ERROR)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Enable the built-in API and web-based dashboard
      - "--api.dashboard=true"
      # Enable the /ping endpoint so we can health-check Traefik
      - "--ping=true"
      # Assign the /ping endpoint to a dedicated entry point on port 8082
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      # Define the primary HTTP entry point on port 80
      - "--entrypoints.web.address=:80"
      # Define the secure (HTTPS) entry point on port 443
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS redirect at entrypoint level
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Enable the Docker provider to detect containers and their labels
      - "--providers.docker=true"
      # Point Traefik to the Docker socket
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Prevent automatic exposure of all containers; only expose containers
      # with "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The email address used by Let's Encrypt for renewal notices
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      # The file where ACME certificates are stored inside the container
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Enable Prometheus metrics
      - "--metrics.prometheus=true"
      # Configure Prometheus histogram buckets
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Check for newer Traefik versions and optionally log that info
      - "--global.checknewversion=true"
      # Disable sending anonymous usage data to the Traefik maintainers
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # A router to expose the Traefik dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic Authentication for the Traefik dashboard
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      # Specify the internal server port to the dashboard service
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # Pass the original Host header to the backend
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backup:
    image: *postgres-image
    # Resource limits as .env-overridable defaults (e.g. ZAMMAD_BACKUP_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${ZAMMAD_BACKUP_MEMORY_LIMIT:-256m}
          cpus: "${ZAMMAD_BACKUP_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${ZAMMAD_BACKUP_MEMORY_RESERVATION:-32m}
          cpus: "${ZAMMAD_BACKUP_CPU_RESERVATION:-0.1}"
    entrypoint: /usr/local/bin/backup.sh
    command: ["zammad-backup"]
    volumes:
      - zammad-backup:/var/tmp/zammad
      - zammad-storage:/opt/zammad/storage:ro
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    environment:
      POSTGRESQL_DB: ${ZAMMAD_DB_NAME:-zammaddb}
      POSTGRESQL_HOST: ${ZAMMAD_POSTGRES_HOST:-postgres}
      POSTGRESQL_USER: ${ZAMMAD_DB_USER:-zammaddbuser}
      POSTGRESQL_PASS: ${ZAMMAD_DB_PASSWORD}
      POSTGRESQL_PORT: ${ZAMMAD_DB_PORT:-5432}
      POSTGRESQL_OPTIONS: ?pool=50
      MEMCACHE_SERVERS: ${ZAMMAD_MEMCACHE_SERVERS:-memcached:11211}
      REDIS_URL: ${ZAMMAD_REDIS_URL:-redis://redis:6379}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      HOLD_DAYS: ${HOLD_DAYS:-10}
      TZ: ${ZAMMAD_TIMEZONE:-America/New_York}
    # zammad-network is required: without it the service landed on the
    # compose default network, where the postgres hostname does not
    # resolve — every scheduled backup failed on DNS.
    networks:
      - zammad-network
    restart: unless-stopped
    depends_on:
      - railsserver
      - postgres